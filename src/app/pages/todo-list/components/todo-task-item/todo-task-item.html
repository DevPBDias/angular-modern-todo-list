<div class="group bg-white/10 backdrop-blur-sm border-2 border-white/20 rounded-xl p-4 hover:bg-white/15 hover:border-white/30 transition-all duration-300 flex items-center gap-4 mt-2">
    
    <!-- Checkbox de conclusão -->
    <button
        type="button"
        (click)="onToggleComplete()"
        class="shrink-0 w-6 h-6 rounded-full border-2 border-white/60 flex items-center justify-center hover:border-amber-400 transition-all duration-300"
        [class.bg-amber-400]="task.completed"
        [class.border-amber-400]="task.completed">
        @if (task.completed) {
            <i class="pi pi-check text-blue-900 text-xs font-bold"></i>
        }
    </button>

    <!-- Texto da tarefa ou input de edição -->
    <div class="flex-1 min-w-0">
        @if (task.editing) {
            <input 
                type="text"
                [value]="task.text"
                [attr.data-task-id]="task.id"
                (keyup.enter)="onSaveEdit()"
                (keyup.escape)="onCancelEdit()"
                (input)="onEditInput($event)"
                class="w-full px-3 py-2 bg-white/20 border-2 border-amber-400 rounded-lg text-white focus:outline-none focus:bg-white/25">
        } @else {
            <p 
                class="text-base md:text-lg wrap-break-word"
                [class.line-through]="task.completed"
                [class.opacity-60]="task.completed"
                (dblclick)="onEdit()">
                {{ task.text }}
            </p>
        }
    </div>

    <!-- Botões de ação -->
    <div class="flex items-center gap-2">
        @if (task.editing) {
            <!-- Botões de salvar e cancelar durante edição -->
            <button
                type="button"
                (click)="onSaveEdit()"
                class="p-2 bg-green-500/30 hover:bg-green-500/40 rounded-lg transition-all duration-300"
                title="Salvar alterações">
                <i class="pi pi-check text-green-400 text-sm"></i>
            </button>
            <button
                type="button"
                (click)="onCancelEdit()"
                class="p-2 bg-gray-500/30 hover:bg-gray-500/40 rounded-lg transition-all duration-300"
                title="Cancelar edição">
                <i class="pi pi-times text-gray-300 text-sm"></i>
            </button>
        } @else {
            <!-- Botões de editar e remover -->
            <button
                type="button"
                (click)="onEdit()"
                class="p-2 bg-blue-500/40 hover:bg-blue-500/20 rounded-lg transition-all duration-300"
                title="Editar tarefa">
                <i class="pi pi-pencil text-white text-sm"></i>
            </button>
            <button
                type="button"
                (click)="onRemove()"
                class="p-2 bg-red-500/20 hover:bg-red-500/30 rounded-lg transition-all duration-300"
                title="Remover tarefa">
                <i class="pi pi-trash text-red-400 text-sm"></i>
            </button>
        }
    </div>
</div>
