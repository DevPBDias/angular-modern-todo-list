<div
  class="flex flex-col items-center gap-2 text-white bg-white/10 backdrop-blur-sm rounded-lg p-4 shadow-lg w-56 relative transition-all duration-300 border border-transparent cursor-grab"
  [class.animate-flash]="flashEffect()">
  <div class="text-2xl font-bold select-none">{{ minutes }}:{{ seconds }}</div>

  <div class="flex gap-2">
    <button (click)="toggleTimer()"
      class="cursor-pointer px-3 py-1 rounded-md bg-white/20 hover:bg-white/30 transition-colors"
      [attr.aria-label]="isRunning() ? 'Pause timer' : 'Start timer'">
      <i class="pi" [class.pi-pause]="isRunning()" [class.pi-play]="!isRunning()"></i>
    </button>

    <button (click)="resetTimer()"
      class="cursor-pointer px-3 py-1 rounded-md bg-white/20 hover:bg-white/30 transition-colors" aria-label="Reset timer">
      <i class="pi pi-refresh"></i>
    </button>

    <button (click)="switchMode()"
      class="cursor-pointer px-3 py-1 rounded-md bg-white/20 hover:bg-white/30 transition-colors"
      [attr.aria-label]="mode() === 'work' ? 'Switch to break' : 'Switch to work'">
      <i class="pi" [class.pi-clock]="mode() === 'break'" [class.pi-hourglass]="mode() === 'work'"></i>
      </button>

    <div>
      @if (isBrowser) {
        <button (click)="enableSound()" class="p-2 cursor-pointer rounded-md bg-white/20 hover:bg-white/30 transition-colors">
          @if (soundEnabled()) {
          <i class="pi pi-volume-up text-green-400"></i>
          } @else {
          <i class="pi pi-volume-off text-gray-400"></i>
          }
        </button>
        } @else {
        <button disabled class="opacity-50 cursor-not-allowed p-2 rounded-md bg-white/20">
          <i class="pi pi-volume-off"></i>
        </button>
        }
    </div>
  </div>
  <div class="mt-3 w-full flex flex-col items-center justify-between gap-2">
    <div class="flex items-center gap-2 w-full justify-center">
      <button (click)="decrementCustom()"
        class="px-2 py-1 rounded-md bg-white/20 hover:bg-white/30 cursor-pointer">-</button>
      <div class="px-3 py-1 bg-white text-sm text-black rounded-md font-medium">{{ customTime() }} min</div>
      <button (click)="incrementCustom()"
        class="px-2 py-1 rounded-md bg-white/20 hover:bg-white/30 cursor-pointer">+</button>
    </div>
  </div>
</div>
