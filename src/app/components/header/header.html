<!-- Header Desktop -->
<header class="absolute top-0 left-0 z-50 bg-transparent text-white hidden lg:flex w-full flex-row justify-between items-cente px-24 py-4">
    <div class="flex items-center justify-center gap-2 pX-2 py-1 border-b-2 border-white">
        <i class="pi pi-book" style="color: white; font-size: 1.5rem;"></i>
        <h4 class="font-bold text-2xl font-handwritten">AllInOne App</h4>
    </div>
</header>

<!-- Header Mobile -->
<header class="absolute top-0 left-0 z-50 bg-transparent text-white w-full flex flex-row justify-between items-center p-4 lg:hidden">
    <div class="flex items-center justify-center gap-2 pX-2 py-1 border-b-2 border-white">
        <i class="pi pi-book" style="color: white; font-size: 1.5rem;"></i>
        <h4 class="font-bold text-2xl font-handwritten">AllInOne App</h4>
    </div>
    <button
        type="button"
        class="flex items-center justify-center p-2 border-2 border-white rounded-full cursor-pointer"
        (click)="toggleNavbar()">
        @if (!showNavbar) {
            <i class="pi pi-align-justify"
               style="color: white; font-size: 1rem;"></i>
        }
    </button>
</header>

<!-- Navbar Mobile -->
@if (showNavbar) {
<nav class="bg-blue-800 text-2xl font-bold text-white  hover:text-gray-600 fixed top-0 left-0 w-full h-screen z-50 flex flex-col items-center justify-center gap-8 lg:hidden">
    <button
        type="button"
        class="absolute top-4 right-4 flex items-center justify-center p-2 border-2 border-white rounded-full cursor-pointer"
        (click)="closeNavbar()">
        <i class="pi pi-times" style="color: white; font-size: 1rem;"></i>
    </button>

    @for (link of navLinks; track link.name) {
        <a [routerLink]="link.path"
           (click)="closeNavbar()"
           class="cursor-pointer text-white">
            {{ link.name }}
        </a>
    }
</nav>
}
